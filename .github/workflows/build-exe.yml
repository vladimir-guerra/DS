name: Build CustomTkinter EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
  
    runs-on: windows-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # O la versión que uses en tu proyecto
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilar con PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --collect-all customtkinter src/main.py

    - name: Guardar artefacto (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: CustomTkinter-App-Windows
        path: dist/